services:
  tradeflow:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - tradeflow-data:/app/data

volumes:
  tradeflow-data:
